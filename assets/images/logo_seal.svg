<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" width="100%" height="100%">
  <defs>
    <radialGradient id="sealBg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0f2b48" />
      <stop offset="70%" stop-color="#0a192f" />
      <stop offset="100%" stop-color="#050c18" />
    </radialGradient>
    <linearGradient id="silverGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="50%" stop-color="#cbd5e1" />
      <stop offset="100%" stop-color="#94a3b8" />
    </linearGradient>
  </defs>

  <!-- Outer Ring -->
  <circle cx="150" cy="150" r="142" fill="url(#sealBg)" stroke="#0284c7" stroke-width="8"/>
  <circle cx="150" cy="150" r="134" fill="none" stroke="#38bdf8" stroke-width="2" opacity="0.6"/>

  <!-- Triangle Emblem -->
  <g transform="translate(75, 45)">
    <path d="M 75 10 L 135 100 L 15 100 Z" fill="none" stroke="url(#silverGrad)" stroke-width="12" stroke-linejoin="miter"/>
    <path d="M 75 20 L 75 100" stroke="url(#silverGrad)" stroke-width="8"/>
    <path d="M 75 45 L 115 100" stroke="url(#silverGrad)" stroke-width="8"/>
    <path d="M 75 68 L 45 100" stroke="url(#silverGrad)" stroke-width="8"/>
    <path d="M 45 65 L 105 65" stroke="url(#silverGrad)" stroke-width="8"/>
  </g>

  <!-- TRIANZA TEXT -->
  <text x="150" y="195" font-family="'Outfit', 'Inter', sans-serif" font-weight="900" font-size="34" letter-spacing="4" fill="#ffffff" text-anchor="middle">TRIANZA</text>
  
  <!-- OBRAS Y SERVICIOS S.L. -->
  <text x="150" y="222" font-family="'Inter', sans-serif" font-weight="800" font-size="14" letter-spacing="3" fill="#cbd5e1" text-anchor="middle">OBRAS Y SERVICIOS S.L.</text>

  <!-- Tagline Banner -->
  <line x1="45" y1="245" x2="95" y2="245" stroke="#0284c7" stroke-width="2"/>
  <text x="150" y="248" font-family="'Inter', sans-serif" font-weight="700" font-size="11" letter-spacing="3" fill="#38bdf8" text-anchor="middle">CONSTRUIMOS CONFIANZA</text>
  <line x1="205" y1="245" x2="255" y2="245" stroke="#0284c7" stroke-width="2"/>
</svg>
