<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 130" width="100%" height="100%">
  <!-- TRIANZA PRIMARY LOGO (DARK NAVY FOR LIGHT BACKGROUNDS) -->
  <g fill="#0a3254">
    <!-- Outer Geometric Triangle Icon -->
    <path d="M 75 12 L 140 115 L 10 115 Z" fill="none" stroke="#0a3254" stroke-width="14" stroke-linejoin="miter"/>
    <!-- Internal Beam 1 (Vertical) -->
    <path d="M 75 22 L 75 115" stroke="#0a3254" stroke-width="10"/>
    <!-- Internal Beam 2 (Diagonal Right) -->
    <path d="M 75 48 L 118 115" stroke="#0a3254" stroke-width="10"/>
    <!-- Internal Beam 3 (Diagonal Left) -->
    <path d="M 75 75 L 45 115" stroke="#0a3254" stroke-width="10"/>
    <!-- Internal Beam 4 (Horizontal Crossbeam) -->
    <path d="M 45 72 L 105 72" stroke="#0a3254" stroke-width="10"/>
  </g>

  <!-- Typography matching exact user logo -->
  <g transform="translate(160, 15)" fill="#0a3254">
    <!-- TRIANZA -->
    <text x="0" y="50" font-family="'Outfit', 'Inter', 'Segoe UI', sans-serif" font-weight="900" font-size="52" letter-spacing="2.5">TRIANZA</text>
    <!-- OBRAS Y -->
    <text x="5" y="78" font-family="'Inter', 'Segoe UI', sans-serif" font-weight="800" font-size="22" letter-spacing="3">OBRAS Y</text>
    <!-- SERVICIOS S.L. -->
    <text x="5" y="102" font-family="'Inter', 'Segoe UI', sans-serif" font-weight="800" font-size="22" letter-spacing="3">SERVICIOS S.L.</text>
  </g>
</svg>
